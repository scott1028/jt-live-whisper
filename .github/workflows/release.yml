# Build the Linux AppImage + Windows portable ZIP and publish a GitHub release.
#   push to main: only when APP_VERSION in translate_meeting.py changed
#   workflow_dispatch: always, for the selected branch/commit
# Names: jt-live-whisper-<version>-<hash>-<os>-x86_64.*, tag v<version>-<hash>
# (hash = first 7 of the commit sha; packaging/ci/release_check.py).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      hash: ${{ steps.check.outputs.hash }}
      tag: ${{ steps.check.outputs.tag }}
      prefix: ${{ steps.check.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: Release or not, and its name
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            python3 packaging/ci/release_check.py --event push \
              --before "$BEFORE" --after "$AFTER"
          else
            python3 packaging/ci/release_check.py --event workflow_dispatch \
              --after "$AFTER"
          fi

  linux:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-22.04  # glibc 2.35: bundled PortAudio libs stay compatible
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PREFIX: ${{ needs.check.outputs.prefix }}
    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libportaudio2 rsync binutils
      - uses: astral-sh/setup-uv@v10.3.1
      - name: Venv from the Linux lock
        run: |
          set -euo pipefail
          uv python install 3.12.13
          "$(uv python find --managed-python 3.12.13)" -m venv .tmp/ci-venv
          .tmp/ci-venv/bin/python -m pip install --no-cache-dir \
            --disable-pip-version-check -r packaging/requirements/linux-x86_64.txt
          .tmp/ci-venv/bin/python -m pip check
      - name: appimagetool 1.9.1 + type2 runtime 20251108 (pinned, checksummed)
        run: |
          set -euo pipefail
          mkdir -p .tmp/tools
          curl -fsSL -o .tmp/tools/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o .tmp/tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<'EOF'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  .tmp/tools/appimagetool-x86_64.AppImage
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  .tmp/tools/runtime-x86_64
          EOF
          chmod +x .tmp/tools/appimagetool-x86_64.AppImage
      - name: Build AppImage
        env:
          VENV: .tmp/ci-venv
          APPIMAGETOOL: .tmp/tools/appimagetool-x86_64.AppImage
          APPIMAGE_RUNTIME: .tmp/tools/runtime-x86_64
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          packaging/appimage/build-appimage.sh 2>&1 | tee build.log
          if grep -qF '[警告] usr/lib/' build.log; then
            echo "::error::bundled libs need glibc > 2.35 (see the build log)"
            exit 1
          fi
      - name: Check name + smoke test (--help)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          JTLW_IN_TERM: "1"
        run: |
          set -euo pipefail
          files=(dist/*.AppImage)
          want="dist/${PREFIX}-linux-x86_64.AppImage"
          if [ "${#files[@]}" -ne 1 ] || [ "${files[0]}" != "$want" ]; then
            echo "::error::expected $want, got: ${files[*]}"
            exit 1
          fi
          "$want" --help < /dev/null > help.txt
          tail -n 4 help.txt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/${{ needs.check.outputs.prefix }}-linux-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0  # already compressed

  windows:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      PREFIX: ${{ needs.check.outputs.prefix }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
      - name: Build portable ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.Encoding]::UTF8  # our scripts print UTF-8
          uv python install 3.12.13
          if ($LASTEXITCODE -ne 0) { throw "uv python install exit $LASTEXITCODE" }
          $py = uv python find --managed-python 3.12.13
          if ($LASTEXITCODE -ne 0) { throw "uv python find exit $LASTEXITCODE" }
          & $py packaging/windows/build-windows.py
          if ($LASTEXITCODE -ne 0) { throw "build-windows.py exit $LASTEXITCODE" }
      - name: Check name + smoke test (extracted ZIP, cmd --help < NUL)
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.Encoding]::UTF8  # our scripts print UTF-8
          $files = @(Get-ChildItem dist -Filter *.zip)
          $want = "$env:PREFIX-windows-x86_64.zip"
          if ($files.Count -ne 1 -or $files[0].Name -ne $want) {
            throw "expected dist/$want, got: $($files.Name -join ', ')"
          }
          $dst = Join-Path $env:RUNNER_TEMP 'jtlw-smoke'
          Expand-Archive -Path (Join-Path dist $want) -DestinationPath $dst
          $cmdFile = Join-Path $dst 'jt-live-whisper\jt-live-whisper.cmd'
          # < NUL: a failing run must never wait in the .cmd's pause
          cmd /c "$cmdFile --help < NUL" > help.txt
          $rc = $LASTEXITCODE
          Get-Content help.txt -Tail 4
          if ($rc -ne 0) { throw "jt-live-whisper.cmd --help exit $rc" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: dist/${{ needs.check.outputs.prefix }}-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0  # already compressed

  release:
    needs: [check, linux, windows]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create the release, or update its files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
          HASH: ${{ needs.check.outputs.hash }}
          PREFIX: ${{ needs.check.outputs.prefix }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          files=("assets/${PREFIX}-linux-x86_64.AppImage"
                 "assets/${PREFIX}-windows-x86_64.zip")
          ls -l "${files[@]}"
          python3 packaging/release_notes.py "$VERSION" "$SHA" > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" --title "jt-live-whisper $VERSION ($HASH)" \
              --notes-file notes.md
          fi
